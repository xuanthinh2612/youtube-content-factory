services:
  youtube-content-factory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-content-factory
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8090:8090"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
